# Custom index for ThinkingSOC hackathon datasets/search workflows.
# Backend analysis/audit storage is in PostgreSQL; this index remains available for Splunk-side data use.

[thinking_soc]
homePath = $SPLUNK_DB/thinking_soc/db
coldPath = $SPLUNK_DB/thinking_soc/colddb
thawedPath = $SPLUNK_DB/thinking_soc/thaweddb
maxDataSize = auto
frozenTimePeriodInSecs = 7776000
