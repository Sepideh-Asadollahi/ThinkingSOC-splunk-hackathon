[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tsoc-devtools-sdk"
version = "0.1.0"
description = "Typed SDK and CLI for ThinkingSOC Lite hackathon backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.0.0"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = [".."]
include = ["devtools*", "models*"]
